<!-- Capa de almacenamiento: reemplaza window.storage (el que usaba el artifact de Claude)
     por la REST API de Firebase Realtime Database. Todo el resto del código de la app
     (lógica de negocio) no sabe que esto cambió. -->
<script>
  window.LF_FIREBASE_URL = "https://libro-saavedra-juarez-default-rtdb.firebaseio.com";
  window.LF_HOGAR_ID = "diego-yani";

  window.storage = {
    async get(key) {
      try {
        const res = await fetch(
          `${window.LF_FIREBASE_URL}/${window.LF_HOGAR_ID}/${encodeURIComponent(key)}.json`
        );
        if (!res.ok) return null;
        const data = await res.json();
        if (data === null || data === undefined) return null;
        return { value: JSON.stringify(data) };
      } catch (e) {
        console.error("storage.get error", key, e);
        return null;
      }
    },
    async set(key, value) {
      try {
        const parsed = JSON.parse(value);
        const res = await fetch(
          `${window.LF_FIREBASE_URL}/${window.LF_HOGAR_ID}/${encodeURIComponent(key)}.json`,
          {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(parsed),
          }
        );
        if (!res.ok) return null;
        return true;
      } catch (e) {
        console.error("storage.set error", key, e);
        return null;
      }
    },
  };
</script>

async function storageSetRetry(key, value, shared = true, retries = 3) {
  for (let i = 0; i <= retries; i++) {
    try {
      const res = await window.storage.set(key, value, shared);
      if (res) return res;
    } catch {
      // reintenta
    }
    if (i < retries) await new Promise(r => setTimeout(r, 500 * (i + 1)));
  }
  return null;
}

async function fetchCotizacionLive() {
  try {
    const res = await fetch("https://dolarapi.com/v1/dolares/oficial");
    if (!res.ok) return null;
    const data = await res.json();
    if (data && typeof data.venta === "number") return data.venta;
    return null;
  } catch {
    return null;
  }
}
function monthKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function monthLabel(key) {
  const [y, m] = key.split("-").map(Number);
  return `${MESES[m - 1]} ${y}`;
}
function shiftMonth(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
}
function monthDiff(from, to) {
  const [fy, fm] = from.split("-").map(Number);
  const [ty, tm] = to.split("-").map(Number);
  return (ty - fy) * 12 + (tm - fm);
}

  async function persistEntries(next) {
    setEntries(next);
    const res = await storageSetRetry(`entries:${month}`, JSON.stringify(next), true);
    if (!res) {

  async function saveSettingsFor(personId, personSettings) {

  function montoArsDeFijo(item) {

  async function saveHogarConfig(list, diegoPct) {
    const newSplit = {
      diego: diegoPct,
      yani: 100 - diegoPct
    };
    setFijosHogar(list);
    setSplitHogar(newSplit);
    const r1 = await storageSetRetry(`fijosHogar`, JSON.stringify(list), true);

    if (changed) await persistEntries(nextEntries);

  async function guardarCotizacion(valor, fuente = "manual") {

  function cargarFijosHogarDelMes() {
    const faltantes = fijosHogar.filter(f => !entries.some(e => e.hogarId === f.id));
    if (faltantes.length === 0) return;
    const now = Date.now();
    const nuevas = [];
    faltantes.forEach((f, i) => {
      ["diego", "yani"].forEach((pid, j) => {
        nuevas.push({
          id: `hogar-${f.id}-${pid}-${now}-${i}-${j}`,

  async function addEntryToOtherMonth(mKey, entry) {
    let existing = [];
    try {
      const r = await window.storage.get(`entries:${mKey}`, true);
      existing = r ? JSON.parse(r.value) : [];
    } catch {
      existing = [];
    }
    const res = await storageSetRetry(`entries:${mKey}`, JSON.stringify([entry, ...existing]), true);
    return Boolean(res);
  }
  async function removeEntryFromOtherMonth(mKey, tarjetaId) {
    try {
      const r = await window.storage.get(`entries:${mKey}`, true);
      const existing = r ? JSON.parse(r.value) : [];
      const filtered = existing.filter(e => e.tarjetaId !== tarjetaId);
      await storageSetRetry(`entries:${mKey}`, JSON.stringify(filtered), true);
    } catch {
      // si no hay nada guardado para ese mes, no hay nada que borrar
    }
  }

  function buildCuotaEntry({

  // Escribe las cuotas de startMonth en adelante. Devuelve la lista de meses (YYYY-MM) que no se pudieron guardar.
  async function writeInstallments(personId, {
    descripcion,
    categoria,
    cuotasNum,
    montoCuota,
    startMonth,
    purchaseId
  }) {
    const fallidos = [];
    for (let i = 0; i < cuotasNum; i++) {
      const mKey = shiftMonth(startMonth, i);
      const entry = buildCuotaEntry({
        purchaseId,
        personId,
        categoria,
        descripcion,
        montoCuota,
        cuotasNum,
        idx: i
      });
      const ok = mKey === month ? await persistEntries([entry, ...entries]) : await addEntryToOtherMonth(mKey, entry);
      if (!ok) fallidos.push(mKey);
      if (i < cuotasNum - 1) await new Promise(r => setTimeout(r, 150));
    }
    return fallidos;
  }
  async function removeInstallments(purchase) {
    for (let i = 0; i < purchase.cuotasTotal; i++) {
      const mKey = shiftMonth(purchase.mesInicio, i);
      if (mKey === month) {
        await persistEntries(entries.filter(e => e.tarjetaId !== purchase.id));
      } else {
        await removeEntryFromOtherMonth(mKey, purchase.id);
      }
      if (i < purchase.cuotasTotal - 1) await new Promise(r => setTimeout(r, 100));
    }
  }
  async function cargarConsumoTarjeta(personId, {
    descripcion,
    monto,
    categoria,
    cuotas
  }) {
    const cuotasNum = Math.max(1, Math.round(Number(cuotas)) || 1);
    const montoTotal = Number(monto) || 0;
    const montoCuota = Math.round(montoTotal / cuotasNum * 100) / 100;
    const purchaseId = `tarjeta-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
    const mesesFallidos = await writeInstallments(personId, {
      descripcion,
      categoria,
      cuotasNum,
      montoCuota,
      startMonth: month,
      purchaseId
    });
    const registro = {
      id: purchaseId,
      descripcion,
      categoria,
      montoTotal,
      montoCuota,
      cuotasTotal: cuotasNum,
      mesInicio: month,
      mesesFallidos
    };
    await saveTarjetasFor(personId, [registro, ...(tarjetas[personId] || [])]);
    if (mesesFallidos.length > 0) {
      setErrorMsg(`"${descripcion}": se guardaron ${cuotasNum - mesesFallidos.length} de ${cuotasNum} cuotas. Faltan ${mesesFallidos.map(monthLabel).join(", ")} — reintentalo desde la lista de Tarjetas.`);
    }
  }

      categoria: nuevosValores.categoria,
      cuotasNum,

    });
    const registro = {

      montoTotal,
      montoCuota,
      cuotasTotal: cuotasNum,
      mesInicio: purchase.mesInicio,
